<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" role="img" aria-label="Moksh Vatsa · honeypots // network recon // open-source security // ML research">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12163a"/>
      <stop offset="100%" stop-color="#080a1a"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="860" height="220" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="860" height="220" fill="url(#bg)"/>

    <!-- terminal title bar -->
    <rect width="860" height="30" fill="#151a3d"/>
    <line x1="0" y1="30.5" x2="860" y2="30.5" stroke="#2b3163"/>
    <circle cx="20" cy="15" r="5" fill="#a78bfa" opacity=".9"/>
    <circle cx="37" cy="15" r="5" fill="#60a5fa" opacity=".85"/>
    <circle cx="54" cy="15" r="5" fill="#2b3163"/>
    <text x="430" y="19.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b95c9">sickwoman@github: ~</text>

    <!-- prompt -->
    <text x="40" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#a78bfa">$</tspan><tspan fill="#e2e8f7"> whoami</tspan></text>

    <!-- name -->
    <text x="38" y="122" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="46" letter-spacing="5" fill="url(#grad)">MOKSH VATSA</text>

    <!-- roles -->
    <text x="40" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#e2e8f7">honeypots<tspan fill="#a78bfa"> // </tspan>network recon<tspan fill="#a78bfa"> // </tspan>open-source security<tspan fill="#a78bfa"> // </tspan>ML research</text>

    <!-- bio + blinking cursor (cursor is part of the same text run, so it always sits right after the words) -->
    <text x="40" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8b95c9">2nd-year student · India · code surfer <tspan fill="#60a5fa">&#9612;<animate attributeName="fill" values="#60a5fa;#0e1230" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>

    <!-- summoning seal (personal mark) -->
    <g transform="translate(760,122)">
      <circle r="70" fill="url(#core)" opacity=".3">
        <animate attributeName="opacity" values=".2;.42;.2" dur="5.5s" repeatCount="indefinite"/>
      </circle>

      <!-- outer ring -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="60s" repeatCount="indefinite"/>
        <circle r="60" fill="none" stroke="url(#grad)" stroke-width="1.3" opacity=".9"/>
        <circle r="55" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2 8" opacity=".75"/>
        <g fill="#bfdbfe" opacity=".85">
          <path transform="rotate(0)   translate(0,-47)" d="M0,-4 L2.6,0 L0,4 L-2.6,0 Z"/>
          <path transform="rotate(45)  translate(0,-47)" d="M0,-4 L2.6,0 L0,4 L-2.6,0 Z"/>
          <path transform="rotate(90)  translate(0,-47)" d="M0,-4 L2.6,0 L0,4 L-2.6,0 Z"/>
          <path transform="rotate(135) translate(0,-47)" d="M0,-4 L2.6,0 L0,4 L-2.6,0 Z"/>
          <path transform="rotate(180) translate(0,-47)" d="M0,-4 L2.6,0 L0,4 L-2.6,0 Z"/>
          <path transform="rotate(225) translate(0,-47)" d="M0,-4 L2.6,0 L0,4 L-2.6,0 Z"/>
          <path transform="rotate(270) translate(0,-47)" d="M0,-4 L2.6,0 L0,4 L-2.6,0 Z"/>
          <path transform="rotate(315) translate(0,-47)" d="M0,-4 L2.6,0 L0,4 L-2.6,0 Z"/>
        </g>
      </g>

      <!-- inner ring, reverse -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="90s" repeatCount="indefinite"/>
        <circle r="40" fill="none" stroke="#60a5fa" stroke-width="1.2" opacity=".8"/>
        <circle r="36" fill="none" stroke="url(#grad)" stroke-width=".8" stroke-dasharray="1 6" opacity=".7"/>
      </g>

      <!-- octagram -->
      <g filter="url(#glow)" opacity=".95">
        <path d="M0,-34 L8,-8 L34,0 L8,8 L0,34 L-8,8 L-34,0 L-8,-8 Z" fill="none" stroke="url(#grad)" stroke-width="1.1"/>
        <rect x="-23" y="-23" width="46" height="46" fill="none" stroke="#a78bfa" stroke-width=".9" opacity=".85"/>
        <rect x="-23" y="-23" width="46" height="46" fill="none" stroke="#a78bfa" stroke-width=".9" opacity=".85" transform="rotate(45)"/>
      </g>

      <circle r="14" fill="#0d1024" stroke="url(#grad)" stroke-width="1"/>
      <text y="6.5" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="18" fill="url(#grad)" filter="url(#glow)">M</text>
    </g>
  </g>

  <rect x=".5" y=".5" width="859" height="219" rx="12" fill="none" stroke="#2b3163"/>
</svg>
