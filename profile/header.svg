<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" role="img" aria-label="Moksh Vatsa · honeypots // network recon // open-source security // ML research">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12163a"/>
      <stop offset="100%" stop-color="#080a1a"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <!-- runs from the leaf's point (centre of the clover) out to its lobes -->
    <linearGradient id="leaf" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="860" height="220" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="860" height="220" fill="url(#bg)"/>

    <!-- terminal title bar -->
    <rect width="860" height="30" fill="#151a3d"/>
    <line x1="0" y1="30.5" x2="860" y2="30.5" stroke="#2b3163"/>
    <circle cx="20" cy="15" r="5" fill="#a78bfa" opacity=".9"/>
    <circle cx="37" cy="15" r="5" fill="#60a5fa" opacity=".85"/>
    <circle cx="54" cy="15" r="5" fill="#2b3163"/>
    <text x="430" y="19.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b95c9">sickwoman@github: ~</text>

    <!-- prompt -->
    <text x="40" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14"><tspan fill="#a78bfa">$</tspan><tspan fill="#e2e8f7"> whoami</tspan></text>

    <!-- name -->
    <text x="38" y="122" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="46" letter-spacing="5" fill="url(#grad)">MOKSH VATSA</text>

    <!-- roles -->
    <text x="40" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#e2e8f7">honeypots<tspan fill="#a78bfa"> // </tspan>network recon<tspan fill="#a78bfa"> // </tspan>open-source security<tspan fill="#a78bfa"> // </tspan>ML research</text>

    <!-- bio + blinking cursor (cursor is part of the same text run, so it always sits right after the words) -->
    <text x="40" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8b95c9">3rd-year student · India · code surfer <tspan fill="#60a5fa">&#9612;<animate attributeName="fill" values="#60a5fa;#0e1230" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>

    <!-- five-leaf clover (personal mark) -->
    <g transform="translate(760,112)">

      <!-- breathing glow -->
      <circle r="74" fill="url(#core)" opacity=".26">
        <animate attributeName="opacity" values=".16;.4;.16" dur="5s" repeatCount="indefinite"/>
      </circle>

      <!-- twinkling sparkles -->
      <g fill="#e0e7ff">
        <g transform="translate(-74,-38)">
          <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z" opacity="0">
            <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0s" repeatCount="indefinite"/>
          </path>
        </g>
        <g transform="translate(70,-48)">
          <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1 Z" opacity="0">
            <animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/>
          </path>
        </g>
        <g transform="translate(76,36)">
          <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z" opacity="0">
            <animate attributeName="opacity" values="0;1;0" dur="3s" begin="-2s" repeatCount="indefinite"/>
          </path>
        </g>
        <g transform="translate(-66,50)">
          <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1 Z" opacity="0">
            <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="-0.6s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>

      <!-- the clover sways gently on its stem -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="7s" repeatCount="indefinite"/>
        <g transform="scale(1.2)">

          <!-- stem, drawn first so it sits behind the leaves -->
          <path d="M0,2 C 3,24 9,44 23,60" fill="none" stroke="url(#stem)" stroke-width="3.2" stroke-linecap="round"/>

          <!-- five heart-shaped leaves, 72 degrees apart; each one swells in turn -->
          <g transform="rotate(0)">
            <g>
              <animateTransform attributeName="transform" type="scale" values="1;1.09;1" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="3s" begin="0s" repeatCount="indefinite"/>
              <path d="M0,0 C -4,-6 -21,-14 -21,-28 C -21,-38 -12,-43 -6,-40 C -3,-38.5 -0.8,-36 0,-33 C 0.8,-36 3,-38.5 6,-40 C 12,-43 21,-38 21,-28 C 21,-14 4,-6 0,0 Z" fill="url(#leaf)" fill-opacity=".92" stroke="#c4b5fd" stroke-width=".8" stroke-opacity=".7"/>
              <path d="M0,-3 L0,-31" stroke="#e0e7ff" stroke-width=".8" stroke-opacity=".35"/>
            </g>
          </g>
          <g transform="rotate(72)">
            <g>
              <animateTransform attributeName="transform" type="scale" values="1;1.09;1" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="3s" begin="0.35s" repeatCount="indefinite"/>
              <path d="M0,0 C -4,-6 -21,-14 -21,-28 C -21,-38 -12,-43 -6,-40 C -3,-38.5 -0.8,-36 0,-33 C 0.8,-36 3,-38.5 6,-40 C 12,-43 21,-38 21,-28 C 21,-14 4,-6 0,0 Z" fill="url(#leaf)" fill-opacity=".92" stroke="#c4b5fd" stroke-width=".8" stroke-opacity=".7"/>
              <path d="M0,-3 L0,-31" stroke="#e0e7ff" stroke-width=".8" stroke-opacity=".35"/>
            </g>
          </g>
          <g transform="rotate(144)">
            <g>
              <animateTransform attributeName="transform" type="scale" values="1;1.09;1" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="3s" begin="0.7s" repeatCount="indefinite"/>
              <path d="M0,0 C -4,-6 -21,-14 -21,-28 C -21,-38 -12,-43 -6,-40 C -3,-38.5 -0.8,-36 0,-33 C 0.8,-36 3,-38.5 6,-40 C 12,-43 21,-38 21,-28 C 21,-14 4,-6 0,0 Z" fill="url(#leaf)" fill-opacity=".92" stroke="#c4b5fd" stroke-width=".8" stroke-opacity=".7"/>
              <path d="M0,-3 L0,-31" stroke="#e0e7ff" stroke-width=".8" stroke-opacity=".35"/>
            </g>
          </g>
          <g transform="rotate(216)">
            <g>
              <animateTransform attributeName="transform" type="scale" values="1;1.09;1" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="3s" begin="1.05s" repeatCount="indefinite"/>
              <path d="M0,0 C -4,-6 -21,-14 -21,-28 C -21,-38 -12,-43 -6,-40 C -3,-38.5 -0.8,-36 0,-33 C 0.8,-36 3,-38.5 6,-40 C 12,-43 21,-38 21,-28 C 21,-14 4,-6 0,0 Z" fill="url(#leaf)" fill-opacity=".92" stroke="#c4b5fd" stroke-width=".8" stroke-opacity=".7"/>
              <path d="M0,-3 L0,-31" stroke="#e0e7ff" stroke-width=".8" stroke-opacity=".35"/>
            </g>
          </g>
          <g transform="rotate(288)">
            <g>
              <animateTransform attributeName="transform" type="scale" values="1;1.09;1" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="3s" begin="1.4s" repeatCount="indefinite"/>
              <path d="M0,0 C -4,-6 -21,-14 -21,-28 C -21,-38 -12,-43 -6,-40 C -3,-38.5 -0.8,-36 0,-33 C 0.8,-36 3,-38.5 6,-40 C 12,-43 21,-38 21,-28 C 21,-14 4,-6 0,0 Z" fill="url(#leaf)" fill-opacity=".92" stroke="#c4b5fd" stroke-width=".8" stroke-opacity=".7"/>
              <path d="M0,-3 L0,-31" stroke="#e0e7ff" stroke-width=".8" stroke-opacity=".35"/>
            </g>
          </g>

          <!-- glowing centre -->
          <circle r="4.5" fill="#e0e7ff" filter="url(#glow)">
            <animate attributeName="r" values="4;5.5;4" dur="3s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>
    </g>
  </g>

  <rect x=".5" y=".5" width="859" height="219" rx="12" fill="none" stroke="#2b3163"/>
</svg>
