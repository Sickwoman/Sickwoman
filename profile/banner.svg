<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="The Grimoire of Moksh — a dark-fantasy summoning seal banner">
  <defs>
    <radialGradient id="vig" cx="72%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#1a0d0f"/>
      <stop offset="60%" stop-color="#0c0708"/>
      <stop offset="100%" stop-color="#070404"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="35%" stop-color="#ff6d4a"/>
      <stop offset="100%" stop-color="#ff4d4f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2e3b0"/>
      <stop offset="100%" stop-color="#c79a3f"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#vig)"/>

  <!-- dust / stars -->
  <g fill="#d9b45a" opacity=".5">
    <circle cx="120" cy="60" r="1"/><circle cx="210" cy="220" r="1"/>
    <circle cx="330" cy="120" r=".8"/><circle cx="60" cy="180" r=".8"/>
    <circle cx="920" cy="255" r="1"/><circle cx="965" cy="90" r=".8"/>
    <circle cx="520" cy="38" r=".8"/><circle cx="640" cy="275" r="1"/>
  </g>

  <!-- ===== summoning seal ===== -->
  <g transform="translate(800,150)">
    <circle r="118" fill="url(#core)" opacity=".5" filter="url(#soft)">
      <animate attributeName="opacity" values=".38;.8;.38" dur="5.5s" repeatCount="indefinite"/>
    </circle>

    <!-- outer runic ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="66s" repeatCount="indefinite"/>
      <circle r="116" fill="none" stroke="url(#goldg)" stroke-width="1.5" opacity=".85"/>
      <circle r="110" fill="none" stroke="#ff4d4f" stroke-width="1" stroke-dasharray="2 10" opacity=".7"/>
      <g font-family="'Noto Sans Runic','Segoe UI Historic',serif" font-size="15" fill="#ecdaa6" opacity=".9" text-anchor="middle">
        <text transform="rotate(0)   translate(0,-99)">&#5792;</text>
        <text transform="rotate(45)  translate(0,-99)">&#5794;</text>
        <text transform="rotate(90)  translate(0,-99)">&#5798;</text>
        <text transform="rotate(135) translate(0,-99)">&#5800;</text>
        <text transform="rotate(180) translate(0,-99)">&#5809;</text>
        <text transform="rotate(225) translate(0,-99)">&#5810;</text>
        <text transform="rotate(270) translate(0,-99)">&#5815;</text>
        <text transform="rotate(315) translate(0,-99)">&#5825;</text>
      </g>
    </g>

    <!-- mid ring, reverse -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="94s" repeatCount="indefinite"/>
      <circle r="84" fill="none" stroke="#ff4d4f" stroke-width="1.5" opacity=".8"/>
      <circle r="78" fill="none" stroke="url(#goldg)" stroke-width=".8" stroke-dasharray="1 7" opacity=".7"/>
    </g>

    <!-- octagram seal -->
    <g filter="url(#glow)" opacity=".95">
      <path d="M0,-72 L17,-17 L72,0 L17,17 L0,72 L-17,17 L-72,0 L-17,-17 Z"
            fill="none" stroke="url(#goldg)" stroke-width="1.4"/>
      <rect x="-49" y="-49" width="98" height="98" fill="none" stroke="#ff4d4f" stroke-width="1.1" transform="rotate(45)" opacity=".85"/>
      <rect x="-49" y="-49" width="98" height="98" fill="none" stroke="#ff4d4f" stroke-width="1.1" opacity=".85"/>
    </g>

    <!-- core glyph -->
    <circle r="29" fill="none" stroke="url(#goldg)" stroke-width="1"/>
    <circle r="7" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="6;9;6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text y="13" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="36" fill="url(#goldg)" filter="url(#glow)">M</text>
  </g>

  <!-- embers -->
  <g fill="#d9b45a">
    <circle cx="730" cy="280" r="2.4" opacity="0">
      <animate attributeName="cy" values="280;70" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="285" r="2" fill="#ff4d4f" opacity="0">
      <animate attributeName="cy" values="285;80" dur="8.5s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="8.5s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="282" r="2.2" opacity="0">
      <animate attributeName="cy" values="282;85" dur="9s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;0" dur="9s" begin="-4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="286" r="1.8" fill="#ff4d4f" opacity="0">
      <animate attributeName="cy" values="286;95" dur="7.8s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.85;0" dur="7.8s" begin="-5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== title block ===== -->
  <text x="70" y="78" font-family="'Courier New',monospace" font-size="13" letter-spacing="6" fill="#ff4d4f">grimoire://moksh &#8212; page 1 of &#8734;</text>

  <text x="66" y="152" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="58" letter-spacing="2" fill="url(#goldg)" filter="url(#glow)">GRIMOIRE</text>
  <text x="70" y="198" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="26" letter-spacing="9" fill="#ece2d4">OF&#160;&#160;MOKSH</text>

  <line x1="72" y1="222" x2="440" y2="222" stroke="#6e3a3c" stroke-width="1"/>
  <text x="72" y="250" font-family="Georgia,serif" font-style="italic" font-size="16" fill="#9f928a">a 2nd-year summoner of cybersecurity, ML &amp; arcane algorithms</text>
</svg>
