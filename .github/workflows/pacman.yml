name: pacman contribution graph

# Draws Pac-Man eating through the contribution graph and publishes the SVGs
# to the "output" branch, so main never collects a daily bot commit.

on:
  schedule:
    - cron: "40 2 * * *"   # daily at 02:40 UTC
  workflow_dispatch:        # run it by hand from the Actions tab

permissions: {}

concurrency:
  group: pacman
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate the Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
